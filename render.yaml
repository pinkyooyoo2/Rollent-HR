# Render Blueprint — 대양롤랜트 인사평가 시스템
# Render 대시보드 → New → Blueprint → 이 저장소 선택 시 아래 설정으로 웹 서비스가 생성됩니다.
#
# SQLite DB 파일을 영구 디스크(/var/data)에 저장합니다.
# 영구 디스크는 유료 인스턴스(starter 이상)에서만 사용할 수 있습니다.
# 무료(free) 플랜으로 바꾸면 디스크 없이 동작하며, 재배포·재시작 때마다 DB가 샘플 데이터로 초기화됩니다.
services:
  - type: web
    name: rollent-hr
    runtime: node
    plan: starter
    region: singapore
    # 빌드 도구(vite, tsx 등)가 devDependencies 에 있으므로 함께 설치
    buildCommand: npm ci --include=dev && npm run build
    # 미적용 마이그레이션 적용 + DB가 비어 있을 때만 샘플 데이터 생성 → 서버 시작
    startCommand: npm run db:seed && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: hr-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: DB_PATH
        value: /var/data/hr.db
      # HTTPS 전용 쿠키
      - key: COOKIE_SECURE
        value: "true"
      # Render 프록시 뒤에서 실제 접속 IP 사용 (로그인 시도 제한·접근 로그)
      - key: TRUST_PROXY
        value: "1"
      - key: TZ_OFFSET
        value: "+09:00"
      - key: SESSION_TTL_HOURS
        value: "8"
